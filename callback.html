<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok sign-in code</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; color: #111; background: #fff; }
  code { display: block; word-break: break-all; background: #f2f2f2; padding: .75rem; border-radius: 6px; }
  button { margin-top: .75rem; padding: .5rem 1rem; font: inherit; }
  .err { color: #b00020; }
</style>
</head>
<body>
<h1>TikTok sign-in</h1>
<p id="msg">Reading the code...</p>
<code id="code"></code>
<button id="copy" hidden>Copy code</button>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error_description") || q.get("error");
  const msg = document.getElementById("msg"), box = document.getElementById("code"), btn = document.getElementById("copy");
  if (code) {
    msg.textContent = "Paste this code into the terminal that is waiting for it:";
    box.textContent = code;
    btn.hidden = false;
    btn.onclick = () => navigator.clipboard.writeText(code).then(() => { btn.textContent = "Copied"; });
  } else {
    msg.className = "err";
    msg.textContent = err ? "TikTok returned an error: " + err : "No code in this address. Start again from the terminal.";
    box.hidden = true;
  }
</script>
</body>
</html>
